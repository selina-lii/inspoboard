[package]
name = "inspoboard"
version = "0.1.0"
description = "Inspoboard: a recursive board of plain-text notes"
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "inspoboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# macos-private-api: a transparent window for the floating subtitle.
tauri = { version = "2.12.1", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# No default features: no HTTPS, no SSH. The app has no network code (SPEC P6).
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
notify-debouncer-mini = "0.6"
# PDF pages drawn natively (pdf_pages.rs). The PDFium library itself is a resource (scripts/fetch-pdfium.mjs).
pdfium-render = "0.8.37"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Reading images from the system clipboard (clipboard.rs). The same versions as Tauri uses.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSArray"] }

[dev-dependencies]
tempfile = "3"
