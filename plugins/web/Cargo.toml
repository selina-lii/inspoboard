# Inspoboard web plugin. A separate program: the core app does not compile it.
# Build: see README.md.
[package]
name = "inspoboard-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Not a member of any workspace: it builds alone.
[workspace]

[dependencies]
serde_json = "1.0"
base64 = "0.22"
# HTTP and HTTPS. Only for the page that the user asks to save, and the files of that page.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Streaming HTML rewriter (removes scripts, puts images and styles inside the page).
lol_html = "2"
encoding_rs = "0.8"
url = "2"
regex = "1"

[profile.release]
lto = "thin"
strip = true
