# Inspoboard voice plugin. A separate program: the core app does not compile it.
# Build: see README.md.
[package]
name = "inspoboard-voice"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Not a member of any workspace: it builds alone.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
bzip2 = "0.6"
tar = "0.4"
# HTTPS only, for the voice pack download.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Offline voices: Kokoro (static link, the build downloads the sherpa-onnx libraries).
sherpa-onnx = "1.13.8"
# Online voices: Microsoft Edge read-aloud service. Used only when the user selects an Edge voice.
msedge-tts = "0.4"
# Two TLS crypto backends are linked (ureq: ring, msedge-tts: aws-lc). main() selects ring.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
