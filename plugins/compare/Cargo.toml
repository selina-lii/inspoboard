# Inspoboard compare plugin (lab). A separate program: the core app does not compile it.
# Build: see README.md.
[package]
name = "inspoboard-compare"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Not a member of any workspace: it builds alone.
[workspace]

[dependencies]
serde_json = "1.0"
# Text differences (Patience algorithm; line, word, and character level). Apache-2.0 / MIT. No network.
similar = { version = "2", features = ["unicode"] }

[profile.release]
lto = "thin"
strip = true
